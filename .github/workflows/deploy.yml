name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The site is hosted on Netlify (balicanta.tw). GitHub Pages is not enabled,
# so the old deploy job failed every push with "Ensure GitHub Pages has been enabled".
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
