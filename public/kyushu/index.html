var SK="page-unlock-pw";
var f=document.getElementById("f"),pw=document.getElementById("pw"),btn=document.getElementById("btn"),msg=document.getElementById("msg");
function show(t,c){msg.textContent=t;msg.className=c||"";}
function b2u(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function decrypt(password){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(P.iv)},key,b2u(P.ct));
  return new TextDecoder().decode(pt);
}
function render(html){
  document.open();
  document.write(html);
  document.close();
}
async function attempt(password,auto){
  if(!(window.crypto&&crypto.subtle)){show("此環境不支援解密（需要 https 或 localhost 安全連線）。請改用 https 網址開啟。","err");return;}
  btn.disabled=true;pw.disabled=true;show("解鎖中，請稍候…","info");
  var html;
  try{ html=await decrypt(password); }
  catch(e){
    btn.disabled=false;pw.disabled=false;
    try{sessionStorage.removeItem(SK);}catch(_){}
    if(auto){show("","");}else{show("密碼不正確","err");pw.value="";pw.focus();}
    return;
  }
  try{sessionStorage.setItem(SK,password);}catch(_){}
  render(html);
}
f.addEventListener("submit",function(e){e.preventDefault();if(pw.value)attempt(pw.value,false);});
